<!DOCTYPE html>

<body class="h-full flex flex-col bg-slate-100 text-slate-800 antialiased selection:bg-ufcteal-600 selection:text-white">

    <!-- CABEÇALHO -->
    <header class="bg-ufcnavy-700 text-white shadow-lg sticky top-0 z-30 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-3">
                    <div class="bg-white p-2 rounded-lg shadow-sm flex items-center justify-center">
                        <i class="fa-solid fa-graduation-cap text-ufcnavy-700 text-2xl"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="bg-ufcteal-600 text-white text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded">ENADE 2026</span>
                            <span class="text-xs text-slate-300 font-medium hidden sm:inline">Engenharia de Produção</span>
                        </div>
                        <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">Simulado Interativo (45 Questões)</h1>
                    </div>
                </div>

                <div class="flex items-center space-x-3 sm:space-x-4">
                    <!-- Cronômetro -->
                    <div class="bg-ufcnavy-900 border border-ufcnavy-500 rounded-xl px-3 py-1.5 flex items-center space-x-2 shadow-inner">
                        <i class="fa-regular fa-clock text-ufcteal-500 text-base" id="timerIcon"></i>
                        <div>
                            <div class="text-[9px] text-slate-400 uppercase font-semibold tracking-wider">Tempo</div>
                            <div id="timerDisplay" class="font-mono text-sm sm:text-base font-bold text-white">00:00:00</div>
                        </div>
                    </div>

                    <!-- Botão Finalizar -->
                    <button onclick="confirmSubmitSimulado()" class="bg-gradient-to-r from-ufcteal-600 to-teal-600 hover:from-ufcteal-700 hover:to-teal-700 text-white px-3.5 py-2 rounded-xl font-semibold text-xs sm:text-sm shadow-md transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span class="hidden sm:inline">Finalizar Prova</span>
                    </button>
                </div>
            </div>
        </div>
        <!-- Barra de Progresso Superior -->
        <div class="w-full bg-ufcnavy-900 h-1.5">
            <div id="topProgressBar" class="bg-ufcteal-500 h-1.5 transition-all duration-300 w-0"></div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL (LAYOUT 2 COLUNAS) -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6">

        <!-- AREA DAS QUESTÕES -->
        <section class="flex-1 min-w-0">
            <!-- CARDS DAS QUESTÕES -->
            <div id="questionsContainer" class="space-y-6"></div>

            <!-- RESULTADOS -->
            <div id="resultsContainer" class="hidden space-y-6"></div>
        </section>

        <!-- CARTÃO RESPOSTA / NAVEGAÇÃO LATERAL -->
        <aside class="w-full md:w-80 flex-shrink-0 no-print">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 sticky top-24">
                <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-table-cells text-ufcnavy-700"></i>
                        <h3 class="font-bold text-sm text-slate-800">Cartão Resposta</h3>
                    </div>
                    <span id="answeredCounter" class="text-xs font-semibold bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full">0 / 45</span>
                </div>

                <!-- Grid com as 45 questões -->
                <div class="grid grid-cols-5 gap-2 max-h-80 overflow-y-auto custom-scrollbar pr-1 mb-4" id="questionsGrid"></div>

                <!-- Ações -->
                <div class="pt-4 border-t border-slate-100 space-y-2">
                    <button onclick="confirmSubmitSimulado()" class="w-full bg-ufcnavy-700 hover:bg-ufcnavy-900 text-white font-semibold py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-2 shadow">
                        <i class="fa-solid fa-circle-check"></i>
                        <span>Corrigir Simulado</span>
                    </button>
                    <button onclick="resetAnswersConfirmation()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 rounded-xl text-xs transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-rotate-left"></i>
                        <span>Limpar Respostas</span>
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <!-- MODAL CONFIRMAÇÃO -->
    <div id="submitModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="text-center">
                <div class="w-12 h-12 bg-ufcteal-50 text-ufcteal-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-clipboard-check"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800">Finalizar o Simulado?</h3>
                <p class="text-xs text-slate-600 mt-1">Você gerará o seu relatório detalhado de acertos e gabarito comentado.</p>
                <div id="unansweredWarning" class="hidden mt-3 p-3 bg-amber-50 text-amber-800 rounded-xl text-xs border border-amber-200 text-left">
                    <i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i>
                    <span id="unansweredCountText"></span>
                </div>
            </div>
            <div class="mt-6 flex space-x-3">
                <button onclick="document.getElementById('submitModal').classList.add('hidden')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 rounded-xl text-xs">Voltar à Prova</button>
                <button onclick="submitSimulado()" class="flex-1 bg-ufcnavy-700 hover:bg-ufcnavy-900 text-white font-semibold py-2 rounded-xl text-xs shadow">Corrigir Agora</button>
            </div>
        </div>
    </div>

        let state = {
            userAnswers: {},
            flagged: new Set(),
            isFinished: false,
            timerSeconds: 0,
            timerInterval: null
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadLocalStorage();
            startTimer();
            renderQuestions();
            renderGrid();
            updateProgressBar();
        });

        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                if (!state.isFinished) {
                    state.timerSeconds++;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const hrs = String(Math.floor(state.timerSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((state.timerSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(state.timerSeconds % 60).padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${hrs}:${mins}:${secs}`;
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questionsData.forEach(q => {
                const card = document.createElement('div');
                card.id = `q_card_${q.id}`;
                card.className = 'bg-white rounded-2xl p-6 shadow-sm border border-slate-200 relative transition hover:shadow-md';

                const isFlagged = state.flagged.has(q.id);
                const selectedOpt = state.userAnswers[q.id];

                card.innerHTML = `
                    <div class="flex items-start justify-between border-b border-slate-100 pb-3 mb-4">
                        <span class="bg-ufcnavy-50 text-ufcnavy-700 text-xs font-bold px-3 py-1 rounded-full">Questão ${q.id} de 45</span>
                        <button onclick="toggleFlag(${q.id})" class="text-slate-400 hover:text-amber-500 text-sm">
                            <i class="${isFlagged ? 'fa-solid fa-bookmark text-amber-500' : 'fa-regular fa-bookmark'}"></i>
                        </button>
                    </div>

                    <div class="text-xs sm:text-sm text-slate-800 font-medium leading-relaxed mb-5 bg-slate-50 p-4 rounded-xl border border-slate-100">
                        ${q.stem}
                    </div>

                    <div class="space-y-2.5">
                        ${['A', 'B', 'C', 'D', 'E'].map(opt => `
                            <label class="flex items-start p-3 rounded-xl border cursor-pointer transition text-xs sm:text-sm ${
                                selectedOpt === opt 
                                    ? 'bg-ufcnavy-50 border-ufcnavy-500 text-ufcnavy-900 font-semibold ring-2 ring-ufcnavy-500/20' 
                                    : 'bg-white border-slate-200 hover:bg-slate-50 text-slate-700'
                            }">
                                <input type="radio" name="q_${q.id}" value="${opt}" ${selectedOpt === opt ? 'checked' : ''} 
                                    onchange="selectOption(${q.id}, '${opt}')" class="mt-0.5 h-4 w-4 text-ufcnavy-700 focus:ring-ufcnavy-500 border-slate-300">
                                <span class="ml-3 font-bold mr-2">${opt})</span>
                                <span class="flex-1">${q.options[opt]}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectOption(qId, opt) {
            state.userAnswers[qId] = opt;
            saveLocalStorage();
            renderGrid();
            updateProgressBar();
            renderQuestions();
        }

        function toggleFlag(qId) {
            if (state.flagged.has(qId)) state.flagged.delete(qId);
            else state.flagged.add(qId);
            saveLocalStorage();
            renderGrid();
            renderQuestions();
        }

        function renderGrid() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            let count = 0;

            questionsData.forEach(q => {
                const isAnswered = !!state.userAnswers[q.id];
                const isFlagged = state.flagged.has(q.id);
                if (isAnswered) count++;

                const btn = document.createElement('button');
                btn.onclick = () => {
                    document.getElementById(`q_card_${q.id}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                };

                let bg = 'bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200';
                if (isAnswered) bg = 'bg-emerald-500 text-white font-bold hover:bg-emerald-600 shadow-sm';
                if (isFlagged) bg = 'bg-amber-400 text-amber-950 font-bold hover:bg-amber-500 shadow-sm';

                btn.className = `w-full h-8 rounded-lg text-xs font-semibold transition flex items-center justify-center ${bg}`;
                btn.innerText = String(q.id).padStart(2, '0');
                grid.appendChild(btn);
            });

            document.getElementById('answeredCounter').innerText = `${count} / 45`;
        }

        function updateProgressBar() {
            const total = questionsData.length;
            const answered = Object.keys(state.userAnswers).length;
            const pct = Math.round((answered / total) * 100);
            document.getElementById('topProgressBar').style.width = `${pct}%`;
        }

        function confirmSubmitSimulado() {
            const total = questionsData.length;
            const answered = Object.keys(state.userAnswers).length;
            const unanswered = total - answered;

            const warning = document.getElementById('unansweredWarning');
            if (unanswered > 0) {
                document.getElementById('unansweredCountText').innerText = `Atenção: Existem ${unanswered} questão(ões) sem resposta.`;
                warning.classList.remove('hidden');
            } else {
                warning.classList.add('hidden');
            }
            document.getElementById('submitModal').classList.remove('hidden');
        }

        function submitSimulado() {
            document.getElementById('submitModal').classList.add('hidden');
            state.isFinished = true;
            saveLocalStorage();
            generateResultsReport();
        }

        function generateResultsReport() {
            document.getElementById('questionsContainer').classList.add('hidden');
            const resContainer = document.getElementById('resultsContainer');
            resContainer.classList.remove('hidden');
            resContainer.innerHTML = '';

            let correctCount = 0;
            questionsData.forEach(q => {
                if (state.userAnswers[q.id] === q.answer) correctCount++;
            });

            const scorePct = Math.round((correctCount / questionsData.length) * 100);

            const header = document.createElement('div');
            header.className = 'bg-white rounded-2xl p-6 shadow-sm border border-slate-200';

                <div class="flex flex-col md:flex-row items-center justify-between gap-6 pb-6 border-b border-slate-100">
                    <div>
                        <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full uppercase">Simulado Concluído</span>
                        <h2 class="text-xl sm:text-2xl font-black text-slate-800 mt-2">Relatório de Desempenho</h2>
                        <p class="text-xs text-slate-500">Gabarito comentado e justificativas técnicas</p>
                    </div>
                    <div class="flex items-center space-x-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <div class="text-center">
                            <div class="text-[10px] text-slate-400 uppercase font-bold">Nota Final</div>
                            <div class="text-3xl font-black text-ufcnavy-700">${scorePct}%</div>
                        </div>
                        <div class="h-10 w-px bg-slate-200"></div>
                        <div class="text-center">
                            <div class="text-[10px] text-slate-400 uppercase font-bold">Acertos</div>
                            <div class="text-2xl font-bold text-emerald-600">${correctCount} / 45</div>
                        </div>
                    </div>
                </div>
                <div class="mt-4 flex justify-end space-x-2 no-print">
                    <button onclick="window.print()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg transition">Imprimir / Salvar PDF</button>
                    <button onclick="resetAnswersConfirmation()" class="bg-ufcnavy-700 hover:bg-ufcnavy-900 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Refazer Simulado</button>
                </div>
            `;
            resContainer.appendChild(header);

            questionsData.forEach(q => {
                const userAns = state.userAnswers[q.id];
                const isCorrect = userAns === q.answer;

                const qCard = document.createElement('div');
                qCard.className = 'bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4';
                qCard.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <span class="font-bold text-sm text-slate-800">Questão ${q.id}</span>
                        ${isCorrect 
                            ? '<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full"><i class="fa-solid fa-check mr-1"></i>Correta</span>'
                            : '<span class="bg-rose-100 text-rose-800 text-xs font-bold px-3 py-1 rounded-full"><i class="fa-solid fa-xmark mr-1"></i>Incorreta</span>'
                        }
                    </div>
                    <div class="text-xs text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-100">${q.stem}</div>
                    
                    <div class="space-y-2 text-xs">
                        ${['A', 'B', 'C', 'D', 'E'].map(opt => {
                            let style = 'bg-white border-slate-200 text-slate-700';
                            if (opt === q.answer) style = 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold';
                            else if (opt === userAns && !isCorrect) style = 'bg-rose-50 border-rose-300 text-rose-900 line-through';
                            return `
                                <div class="p-2.5 rounded-lg border flex items-start space-x-2 ${style}">
                                    <span class="font-bold">${opt})</span>
                                    <span>${q.options[opt]}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="bg-ufcnavy-50 border-l-4 border-ufcnavy-700 p-3.5 rounded-r-xl text-xs text-ufcnavy-900">
                        <div class="font-bold mb-1"><i class="fa-solid fa-chalkboard-user mr-1"></i>Gabarito e Justificativa:</div>
                        <div>${q.explanation}</div>
                    </div>
                `;
                resContainer.appendChild(qCard);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveLocalStorage() {
            const data = {
                userAnswers: state.userAnswers,
                flagged: Array.from(state.flagged),
                timerSeconds: state.timerSeconds,
                isFinished: state.isFinished
            };
            localStorage.setItem('simulado_enade_2026_data', JSON.stringify(data));
        }

        function loadLocalStorage() {
            const saved = localStorage.getItem('simulado_enade_2026_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.userAnswers = parsed.userAnswers || {};
                    state.flagged = new Set(parsed.flagged || []);
                    state.timerSeconds = parsed.timerSeconds || 0;
                    state.isFinished = parsed.isFinished || false;
                    if (state.isFinished) generateResultsReport();
                } catch(e){}
            }
        }

        function resetAnswersConfirmation() {
            if (confirm('Deseja realmente reiniciar o simulado e apagar suas respostas?')) {
                localStorage.removeItem('simulado_enade_2026_data');
                state.userAnswers = {};
                state.flagged.clear();
                state.timerSeconds = 0;
                state.isFinished = false;
                document.getElementById('resultsContainer').classList.add('hidden');
                document.getElementById('questionsContainer').classList.remove('hidden');
                renderQuestions();
                renderGrid();
                updateProgressBar();
            }
        }
    </script>
</body>
</html>
